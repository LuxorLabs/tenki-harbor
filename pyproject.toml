[project]
name = "tenki-harbor"
version = "0.1.0"
description = "Run Harbor agent evaluations on Tenki Sandbox VMs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "harbor>=0.23.0,<0.24",
    "tenki[async]>=1.4.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenki_harbor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits Tenki production; needs TENKI_API_KEY"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
tenki-harbor = "tenki_harbor.cli:main"
